name: Build Rexuiz for R36S

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build inside ARM64 Ubuntu 20.04 Container
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu20.04
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verhindert interaktive Abfragen während der Installation
          export DEBIAN_FRONTEND=noninteractive
          
          # 1. Paketquellen aktualisieren und alle benötigten Abhängigkeiten installieren
          apt-get update
          apt-get install -y build-essential libsdl2-dev libtheora-dev libvorbis-dev libpng-dev libjpeg-dev libopus-dev zlib1g-dev zip git
          
          # 2. Klonen des für PortMaster optimierten DarkPlaces-Codes von Slayer366
          git clone https://github.com/slayer366/darkplaces.git engine-src
          cd engine-src
          
          # 3. R36S / RK3326 (Cortex-A35) Hardware-Optimierungen (mit -O2 zur Vermeidung von QEMU-Compilerabstürzen)
          export CFLAGS="-O2 -march=armv8-a+crc -mtune=cortex-a35"
          
          # 4. Engine kompilieren (Seriell mit -j1 für maximale Stabilität unter Emulation)
          make -j1 sdl-release
          
          # 5. Struktur für die Ausgabe vorbereiten und autoexec.cfg direkt generieren
          cd ..
          mkdir -p dist/rexuiz
          cp engine-src/darkplaces-sdl dist/rexuiz/rexuiz-bin
          chmod +x dist/rexuiz/rexuiz-bin
          
          # Automatische Erstellung der autoexec.cfg für funktionierende Menü- & Gamepad-Steuerung
          cat << 'EOF' > dist/rexuiz/autoexec.cfg
          // ==========================================
          // Rexuiz / DarkPlaces autoexec.cfg für R36S
          // ==========================================
          joystick "1"
          joyadvanced "1"
          
          # Menü- und In-Game-Tastenbelegungen
          bind JOY1 "menu_enter"
          bind JOY2 "togglemenu"
          bind JOY3 "+jump"
          bind JOY4 "+attack"
          
          # Joystick-Achsen für den R36S (Linker Stick & D-Pad)
          joyadvaxisx "3"
          joyadvaxisy "1"
          joyadvaxisz "4"
          joyadvaxisr "2"
          
          # Empfindlichkeit anpassen
          joyforwardsensitivity "-1.8"
          joyyawsensitivity "-1.8"
          joyadvancedupdate
          EOF
          
          # 6. Start-Skript kopieren und ausführbar machen
          cp Rexuiz.sh dist/
          chmod +x dist/Rexuiz.sh
          
          # Ordnerrechte für den Nachfolge-Schritt komplett freigeben
          chmod -R 777 dist

    - name: Package Zip
      run: |
        # Komplettes PortMaster-Paket schnüren
        cd dist
        zip -r ../rexuiz-portmaster.zip Rexuiz.sh rexuiz/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rexuiz-r36s-portmaster
        path: rexuiz-portmaster.zip
