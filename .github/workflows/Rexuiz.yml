name: Build Rexuiz for R36S (Clang Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build inside ARM64 Ubuntu 24.04 Container with Clang
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu24.04
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          run: |
            export DEBIAN_FRONTEND=noninteractive
            
            # 1. Abhängigkeiten und Clang installieren
            apt-get update
            apt-get install -y build-essential clang libsdl2-dev libtheora-dev libvorbis-dev libpng-dev libjpeg-dev libopus-dev zlib1g-dev zip unzip wget git
            
            # 2. Source-Code laden
            git clone https://github.com/slayer366/darkplaces.git engine-src
            cd engine-src
            
            # 3. Makefiles anpassen (-O1 für Clang ist stabil und schnell)
            sed -i 's/-O3/-O1/g' makefile.inc
            sed -i 's/-O2/-O1/g' makefile.inc
            sed -i 's/-ffinite-math-only//g' makefile.inc
            sed -i 's/-fno-math-errno//g' makefile.inc
            sed -i 's/-fno-rounding-math//g' makefile.inc
            sed -i 's/-fno-signaling-nans//g' makefile.inc
            sed -i 's/-fno-trapping-math//g' makefile.inc
            
            # 4. Engine mit Clang (CC=clang) stabil kompilieren
            make -j1 sdl-release CC=clang OPT_RELEASE="-O1"
            
            # 5. Ordnerstruktur vorbereiten
            cd ..
            mkdir -p dist/rexuiz
            cp engine-src/darkplaces-sdl dist/rexuiz/rexuiz-bin
            chmod +x dist/rexuiz/rexuiz-bin
            
            # 6. Spieldateien automatisch herunterladen und entpacken
            echo "Lade Rexuiz Spieldateien herunter..."
            wget -O rexuiz-data.zip "https://sourceforge.net/projects/rexuiz/files/latest/download"
            mkdir -p temp_data
            unzip -q rexuiz-data.zip -d temp_data
            
            if [ -d "temp_data/data" ]; then
              cp -r temp_data/data dist/rexuiz/
            else
              find temp_data -type d -name "data" -exec cp -r {} dist/rexuiz/ \;
            fi
            
            rm -rf temp_data rexuiz-data.zip
            
            # 7. Perfekt optimierte autoexec.cfg für den R36S erstellen
            cat << 'EOF' > dist/rexuiz/autoexec.cfg
            // ==========================================
            // Rexuiz R36S Ultimate Performance & Controls
            // ==========================================
            
            // --- STEUERUNG ---
            joystick "1"
            joyadvanced "1"
            bind JOY1 "menu_enter"
            bind JOY2 "togglemenu"
            bind JOY3 "+jump"
            bind JOY4 "+attack"
            
            joyadvaxisx "3"
            joyadvaxisy "1"
            joyadvaxisz "4"
            joyadvaxisr "2"
            joyforwardsensitivity "-1.8"
            joyyawsensitivity "-1.8"
            joyadvancedupdate
            
            // --- PERFORMANCE & GRAFIK-OPTIMIERUNG (R36S) ---
            gl_texturecompression "1"
            r_shadows "0"
            r_watersmooth "0"
            r_coronas "0"
            r_particles_quality "0.5"
            v_gunkick "0"
            
            // --- AUFLÖSUNG & UI FÜR R36S (640x480) ---
            vid_conwidth "640"
            vid_conheight "480"
            vid_fullscreen "1"
            EOF
            
            # 8. Start-Skript kopieren
            cp Rexuiz.sh dist/
            chmod +x dist/Rexuiz.sh
            
            # 9. Rechte freigeben
            chmod -R 777 dist

      - name: Package Zip
        run: |
          cd dist
          zip -r ../rexuiz-portmaster.zip Rexuiz.sh rexuiz/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rexuiz-r36s-portmaster
          path: rexuiz-portmaster.zip
