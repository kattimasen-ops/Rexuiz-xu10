name: Build Rexuiz for R36S

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build inside ARM64 Ubuntu 20.04 Container
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu20.04
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verhindert interaktive Abfragen während der Installation
          export DEBIAN_FRONTEND=noninteractive
          
          # 1. Paketquellen aktualisieren und ALLE benötigten Abhängigkeiten installieren
          apt-get update
          apt-get install -y build-essential libsdl2-dev libtheora-dev libvorbis-dev libpng-dev libjpeg-dev libopus-dev zlib1g-dev zip git
          
          # 2. Klonen des für PortMaster optimierten DarkPlaces-Codes von Slayer366
          git clone https://github.com/slayer366/darkplaces.git engine-src
          cd engine-src
          
          # 3. R36S / RK3326 (Cortex-A35) Hardware-Optimierungen injizieren
          export CFLAGS="-O3 -march=armv8-a+crc -mtune=cortex-a35 -ffast-math"
          
          # 4. Engine kompilieren - ZURÜCK AUF SINGLE-CORE FÜR 100% STABILITÄT unter QEMU
          make sdl-release
          
          # 5. Struktur für die Ausgabe vorbereiten
          cd ..
          mkdir -p dist/rexuiz
          cp engine-src/darkplaces-sdl dist/rexuiz/rexuiz-bin
          chmod +x dist/rexuiz/rexuiz-bin
          
          # 6. RECHTE-OPTIMIERUNG: Skripte als Root kopieren, um Permission-Fehler zu vermeiden
          cp Rexuiz.sh dist/
          cp autoexec.cfg dist/rexuiz/
          chmod +x dist/Rexuiz.sh
          
          # Ordnerrechte für den nachfolgenden GitHub-User komplett freigeben
          chmod -R 777 dist

    - name: Package Zip
      run: |
        # Komplettes PortMaster-Paket fehlerfrei schnüren
        cd dist
        zip -r ../rexuiz-portmaster.zip Rexuiz.sh rexuiz/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rexuiz-r36s-portmaster
        path: rexuiz-portmaster.zip
