// ====================================================================
// 1. HIGH-END GRAFIK-EINSTELLUNGEN (FÜR GEMODDETEN R36S OPMIERT)
// ====================================================================
vid_width 640
vid_height 480
vid_fullscreen 1
vid_desktop 0

// Texturen & Filter (Maximale Qualität dank schneller SD-Karte & zRAM)
gl_texturecompression 0         // 0 = AUS. Knackscharfe, unkomprimierte Texturen
gl_texture_anisotropy 4         // Leichtes anisotropes Filtern für schärfere Wände in der Distanz
r_mipmaps 1                     // Aktiviert glatte Texturübergänge

// Licht & Schatten (Der Sweetspot für die Mali-G31 GPU mit Kühlung)
r_shadow_realtime_dlight 1      // 1 = AN! Dynamische Lichter (Schüsse und Explosionen leuchten den Raum aus)
r_shadow_realtime_world 0       // 0 = AUSlassen! (Echtzeit-Weltschatten fressen selbst auf PCs zu viel Leistung)
r_shadows 1                     // 1 = AN. Klassische, performante Objektschatten
r_bloom 1                       // 1 = AN. Schöner Überstrahlungseffekt bei hellen Lichtern/Energieeffekten

// Effekte & Geometrie (Volle Pracht)
cl_particles_quality 1.0        // 1.0 = Volle Partikelqualität für dichte Rauch- und Funken-Effekte
r_particles 1                   // Partikel aktivieren
r_water 1                       // Schöne Wasser-Animationen und Shader
r_water_resolutionmultiplier 1.0 // Volle Auflösung für Wasser-Reflektionen
r_subdivisions_max 4            // Niedrigerer Wert = Rundere, detailliertere Kurven in der Map-Geometrie

showfps 1                       // FPS-Anzeige, damit du den Erfolg deiner Mods siehst

// ====================================================================
// 2. CONTROLLER-STEUERUNG (PERFEKTES R36S LAYOUT)
// ====================================================================
joy_enable 1
joy_deadzone 0.12               // Leicht verringert für präziseres Zielen, da deine Sticks geschont werden

// Linker Stick: Fortbewegung
joy_side_axis 0                 // Links/Rechts strafen
joy_forward_axis 1              // Vorwärts/Rückwärts laufen
joy_side_sensitivity 1.0
joy_forward_sensitivity -1.0

// Rechter Stick: Kamera & Zielen
joy_yaw_axis 2                  // Kamera Links/Rechts
joy_pitch_axis 3                // Kamera Oben/Unten
joy_yaw_sensitivity -1.6        // Knackige, schnelle Drehung für Arena-Kämpfe
joy_pitch_sensitivity 1.3       // Vertikale Empfindlichkeit

// Tastenbelegung
bind PAD_A "+jump"              // A: Springen (Bunny Hopping)
bind PAD_X "+crouch"            // X: Ducken
bind PAD_B "+use"               // B: Benutzen

// Trigger (Schießen & Waffenwechsel)
bind PAD_RIGHTSHOULDER "+attack"  // R1: Primärfeuer
bind PAD_RIGHTTRIGGER "+attack2" // R2: Sekundärfeuer / Greifhaken
bind PAD_LEFTSHOULDER "weapnext" // L1: Nächste Waffe
bind PAD_LEFTTRIGGER "weapprev"  // L2: Vorherige Waffe

// D-Pad (Schnellwahltasten für Waffen)
bind PAD_DPAD_UP "weapon_select 3"    // Oben: Rocket Launcher / Schwere Waffe
bind PAD_DPAD_DOWN "weapon_select 1"  // Unten: Melee / Startwaffe
bind PAD_DPAD_LEFT "weapon_select 2"  // Links: Shotgun / Nahkampf
bind PAD_DPAD_RIGHT "weapon_select 4" // Rechts: Plasma / Fernkampf

// System
bind PAD_START "togglemenu"      // START: Menü / Pause
bind PAD_BACK "+showscores"     // SELECT: Scoreboard (Punkteanzeige)
