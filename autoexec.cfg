// R36S Display-Anpassung (Native Auflösung)
vid_width 640
vid_height 480
vid_fullscreen 1
vid_desktop 0

// Grafik-Downgrade für stabile 60 FPS auf dem RK3326
r_shadow_realtime_dlight 0
r_shadow_realtime_world 0
r_shadows 0
r_bloom 0
r_water 0
r_water_resolutionmultiplier 0.5
r_subdivisions_max 8

// Partikel reduzieren (wichtig bei Explosionen/Uzi-Feuer)
r_particles 1
cl_particles_quality 0.25

// Texturkompression aktivieren um RAM zu sparen (R36S hat nur 1GB)
gl_texturecompression 1

// FPS Anzeige aktivieren zum Testen
showfps 1
